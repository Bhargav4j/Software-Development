version: '3.8'

services:
  tourmanagement-app:
    image: tourmanagement:latest
    container_name: tourmanagement-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_MIN_POOL_SIZE=${DB_MIN_POOL_SIZE:-5}
      - DB_MAX_POOL_SIZE=${DB_MAX_POOL_SIZE:-20}
      - DB_COMMAND_TIMEOUT=${DB_COMMAND_TIMEOUT:-30}
      - SESSION_TIMEOUT_MINUTES=${SESSION_TIMEOUT_MINUTES:-30}
      - DISABLE_HTTPS_REDIRECT=${DISABLE_HTTPS_REDIRECT:-false}
      - MAX_RETRY_COUNT=${MAX_RETRY_COUNT:-5}
      - MAX_RETRY_DELAY_SECONDS=${MAX_RETRY_DELAY_SECONDS:-30}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    volumes:
      - ./logs:/app/logs
      - ./appsettings:/app/appsettings
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge